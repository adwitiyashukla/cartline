name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SPARK_LOCAL_IP: 127.0.0.1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,orchestration]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  pipeline:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,orchestration]"
      - run: python -m cartline.cli generate --events 2000000 --force
      - run: python -m cartline.cli pipeline
      - run: python -m cartline.cli landing --events 50000 --files 5
      - run: python -m cartline.cli stream
      - run: python -m cartline.cli gold --date 2019-10-15
      - run: python -m cartline.cli quality
      - run: airflow db migrate
      - run: airflow dags test cartline_daily 2019-10-05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: data/reports/*.json
